<div class="field">
    <label for="mobile">Test phone number</label>
    <input
        type="tel"
        id="mobile"
        placeholder="+263 7XXXXXXXX"
        pattern="\+2637[0-9]{8}"
        autocomplete="off"
        required>
</div>

<div class="field">
    <label for="pin">Demo PIN</label>
    <input
        type="password"
        id="pin"
        placeholder="Enter a demo PIN"
        inputmode="numeric"
        minlength="4"
        maxlength="4"
        pattern="[0-9]{4}"
        autocomplete="off"
        required>
</div>
